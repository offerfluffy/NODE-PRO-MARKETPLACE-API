openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: API for an Allegro-like marketplace with products, orders, payments, and inventory control.

servers:
  - url: http://localhost:3000
    description: Local development server

security: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check application health
      responses:
        "200":
          description: Application process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /db:
    get:
      operationId: checkDatabaseConnection
      summary: Check the database connection
      responses:
        "200":
          description: Database connection is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnectionResponse"

  /config:
    get:
      operationId: getRuntimeConfig
      summary: Get non-sensitive runtime configuration
      responses:
        "200":
          description: Runtime configuration returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfigResponse"

  /products:
    get:
      operationId: listProducts
      summary: List products
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of products to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque pagination token from the previous response. Clients must not parse it.
          schema:
            type: string
      responses:
        "200":
          description: Product list returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          description: Invalid pagination params
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /products/{product_id}:
    get:
      operationId: getProductById
      summary: Get product by id
      parameters:
        - name: product_id
          in: path
          required: true
          description: Product identifier.
          schema:
            type: string
      responses:
        "200":
          description: Product returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of orders to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque pagination token from the previous response. Clients must not parse it.
          schema:
            type: string
      responses:
        "200":
          description: Order list returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "400":
          description: Invalid pagination params
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createOrder
      summary: Create order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Unique key for safe retries. If the same key is used with the same
            request body, the API returns the same response instead of creating
            a duplicate order.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid body or missing Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Not enough inventory
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Same Idempotency-Key with different body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders/{order_id}:
    get:
      operationId: getOrderById
      summary: Get order by id
      parameters:
        - name: order_id
          in: path
          required: true
          description: Order identifier.
          schema:
            type: string
      responses:
        "200":
          description: Order returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - uptimeSec
      properties:
        status:
          type: string
          enum:
            - ok
        uptimeSec:
          type: integer
          minimum: 0

    DatabaseConnectionResponse:
      type: object
      required:
        - current_user
        - now
      properties:
        current_user:
          type: string
        now:
          type: string
          description: Current PostgreSQL timestamp rendered as text.

    RuntimeConfigResponse:
      type: object
      required:
        - port
        - logLevel
        - timeoutMs
        - dbHost
        - dbUser
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        logLevel:
          type: string
          enum:
            - debug
            - info
            - warn
            - error
        timeoutMs:
          type: integer
          minimum: 1
        dbHost:
          type: string
        dbUser:
          type: string

    Product:
      type: object
      required:
        - id
        - seller_id
        - title
        - price_cents
        - status
      properties:
        id:
          type: string
        seller_id:
          type: string
        title:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        status:
          type: string
          enum:
            - active
            - hidden
            - blocked

    Order:
      type: object
      required:
        - id
        - customer_id
        - status
        - total_cents
        - items
      properties:
        id:
          type: string
        customer_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
        total_cents:
          type: integer
          example: 5298
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderItem:
      type: object
      required:
        - product_id
        - quantity
        - price_cents
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        price_cents:
          type: integer

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
              quantity:
                type: integer
                minimum: 1

    ProductListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page. Null means there are no more pages.

    OrderListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page. Null means there are no more pages.

    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
