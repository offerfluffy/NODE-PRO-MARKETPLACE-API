name: marketplace-api
services:
  db:
    image: postgres:16-alpine
    ports:
      - '21110:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_bootstrap
      POSTGRES_DB: shop
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d shop']
      interval: 2s
      timeout: 2s
      retries: 15
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - '21120:5432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "PGPASSWORD=admin_bootstrap psql -h 127.0.0.1 -p 5432 -U admin -d shop -c 'SELECT 1' >/dev/null",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
  restore:
    image: postgres:16-alpine
    profiles:
      - drill
    environment:
      POSTGRES_USER: restore_admin
      POSTGRES_PASSWORD: restore_password
      POSTGRES_DB: shop_restore
    volumes:
      - restore_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restore_admin -d shop_restore']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  restore_data:
    name: marketplace-api-restore-drill-data
